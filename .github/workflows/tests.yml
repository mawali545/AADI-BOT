name: AADI Bot tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run Android unit tests and assemble APK
        working-directory: android
        run: gradle --no-daemon --stacktrace clean testDebugUnitTest assembleDebug
      - name: Package Android source
        working-directory: android
        run: zip -r ../dr-candle-tracker-android-source.zip app build.gradle settings.gradle gradle.properties
      - uses: actions/upload-artifact@v4
        with:
          name: dr-candle-tracker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: dr-candle-tracker-android-source
          path: dr-candle-tracker-android-source.zip
          if-no-files-found: error
          retention-days: 14
