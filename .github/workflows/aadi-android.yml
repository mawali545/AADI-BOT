name: AADI Android build and tests

on:
  push:
    branches:
      - chinese-engine-history-merge-2026-11-13
      - aadi-114-manual-generate-signal
      - dr-candle-tracker-android
  pull_request:
    branches:
      - android-webview-app
      - dr-ci-base
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 35 platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: android/.android-signing/aadi-debug.keystore
          key: aadi-debug-signing-key-v1
      - name: Create debug signing key only on first build
        run: |
          mkdir -p android/.android-signing
          if [ ! -f android/.android-signing/aadi-debug.keystore ]; then
            keytool -genkeypair -v -keystore android/.android-signing/aadi-debug.keystore -storepass aadi-debug-store -alias aadi-debug -keypass aadi-debug-store -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=DR Candle Tracker,O=DR,C=PK"
          fi
      - name: Validate DR tracker JavaScript
        run: node --check android/app/src/main/assets/dr-tracker.js
      - name: Run JVM unit tests
        run: gradle -p android testDebugUnitTest
      - name: Build debug APK
        run: gradle -p android assembleDebug
      - name: Verify APK package identity
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.dr.candletracker'"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dr-candle-tracker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
