name: DR Candle Tracker Android Build
# Scoped to the dedicated DR Candle Tracker feature branch.

on:
  push:
    branches:
      - dr-candle-tracker-build207-secure-fix
      - dr-candle-tracker-build215-period-default-fix
      - dr-candle-tracker-build216-auth-status-honesty
      - dr-candle-tracker-build217-fast-signal
      - dr-candle-tracker-build233-qx-frame-parser
      - dr-candle-tracker-build234-qx-order-asset-fix
      - dr-candle-tracker-build235-qx-telemetry-fix
      - dr-candle-tracker-build236-diagnostics-honesty
      - dr-candle-tracker-build242-live-tick-order
      - dr-candle-tracker-build244-closed-candle-entry
      - dr-candle-tracker-build261-low-latency-live-flow
      - dr-candle-tracker-build261-binary-knowledge-upgrade
      - dr-candle-tracker-build308-complete-binary-knowledge
  pull_request:
    branches:
      - dr-candle-tracker-build207-secure-fix
      - dr-candle-tracker-build215-period-default-fix
      - dr-candle-tracker-build216-auth-status-honesty
      - dr-candle-tracker-build217-fast-signal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate tracker JavaScript
        run: node --check android/app/src/main/assets/dr-tracker.js

      - name: Run unit tests and assemble debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace clean testDebugUnitTest assembleDebug

      - name: Package Android source
        working-directory: android
        run: zip -r ../dr-candle-tracker-android-source.zip app build.gradle settings.gradle gradle.properties

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dr-candle-tracker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: dr-candle-tracker-android-source
          path: dr-candle-tracker-android-source.zip
          if-no-files-found: error
          retention-days: 14
