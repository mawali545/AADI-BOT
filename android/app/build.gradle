plugins { id 'com.android.application' }

android {
    namespace 'com.dr.candletracker'
    compileSdk 35
    defaultConfig {
        applicationId 'com.dr.candletracker'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0.0'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
}
